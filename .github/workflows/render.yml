name: Render Remotion Graphics
on: [workflow_dispatch]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: |
          mkdir -p out
          npx remotion render src/index.ts Shot05 out/shot_05.mp4
          npx remotion render src/index.ts Shot29 out/shot_29.mp4
          npx remotion render src/index.ts Shot30 out/shot_30.mp4
          npx remotion render src/index.ts Shot47 out/shot_47.mp4
          npx remotion render src/index.ts Shot40 out/shot_40_transparent.webm --codec=vp9 --pixel-format=yuva420p
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-sandy-graphics
          path: out/*
