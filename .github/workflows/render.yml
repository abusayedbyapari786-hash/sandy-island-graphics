name: Render Image Clips Only

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core
          npm install

      - name: Render ONLY the 9 cinematic image clips
        run: |
          mkdir -p out_images
          npx remotion bundle src/index.ts --out-dir /tmp/remotion-build --public-dir=.
          for id in Shot12 Shot15 Shot22 Shot25 Shot27 Shot31 Shot35 Shot37 Shot38; do
            npx remotion render /tmp/remotion-build $id out_images/${id}.mp4 --concurrency=4 --gl=angle
          done

      - name: Upload 9 image clips zip
        uses: actions/upload-artifact@v4
        with:
          name: sandy-island-image-clips
          path: out_images/*
