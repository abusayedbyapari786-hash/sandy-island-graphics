name: Render All Remotion Graphics

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core
          npm install

      - name: Bundle once and render all clips fast
        run: |
          mkdir -p out
          npx remotion bundle src/index.ts --out-dir build --public-dir=.
          for id in Shot05 Shot11 Shot13 Shot14 Shot16 Shot18 Shot19 Shot23 Shot24 Shot29 Shot30 Shot32 Shot33 Shot36 Shot39 Shot42 Shot44 Shot45 Shot46 Shot47; do
            npx remotion render build $id out/${id}.mp4 --concurrency=4 --gl=angle
          done
          for ov in Shot40 BadgeRecreation LT-Velocity LT-Surveyor LT-BBC LT-Seton LT-Dougherty LT-Agloe; do
            npx remotion render build $ov out/${ov}_transparent.webm --codec=vp9 --image-format=png --pixel-format=yuva420p --concurrency=4 --gl=angle
          done

      - name: Upload rendered graphics zip
        uses: actions/upload-artifact@v4
        with:
          name: all-sandy-island-graphics
          path: out/*
