name: Render All Remotion Graphics

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render all 21 MP4 graphics and 8 transparent WebM overlays
        run: |
          mkdir -p out
          for id in Shot05 Shot11 Shot13 Shot14 Shot16 Shot18 Shot19 Shot23 Shot24 Shot29 Shot30 Shot32 Shot33 Shot36 Shot39 Shot42 Shot44 Shot45 Shot46 Shot47; do
            npx remotion render src/index.ts $id out/${id}.mp4
          done
          for ov in Shot40 BadgeRecreation LT_Velocity LT_Surveyor LT_BBC LT_Seton LT_Dougherty LT_Agloe; do
            npx remotion render src/index.ts $ov out/${ov}_transparent.webm --codec=vp9 --pixel-format=yuva420p
          done

      - name: Upload rendered graphics zip
        uses: actions/upload-artifact@v4
        with:
          name: all-sandy-island-graphics
          path: out/*
